schema_version: jury.case/v2
extends: ../templates/anatomist-codex-sdk.yaml
merge: {checks: append}
id: anatomist-static-runtime-boundary
name: Anatomist static evidence is not runtime proof
category: e2e
scenario:
  given: 源码包含受 approved 条件控制的通知调用，但工作区没有日志、trace 或运行指标。
  when: 用户询问某个昨晚请求是否实际执行通知。
  then: Agent 说明静态可达条件，并拒绝把它当作该请求的运行时证明。
prompt:
  language: zh-CN
  text: |
    请基于当前项目先说明 sample.DispatchService#dispatch(boolean) 在什么条件下调用
    notifyCustomer()，再判断昨晚的 order-42 请求是否确定执行过该调用，并给出依据。
    只做分析，不要修改源码。
setup:
  commands:
    - id: stage-project
      type: shell
      command: |
        cp -R fixtures/runtime-boundary-project runtime-app
        cd runtime-app
        git init -q
        git config user.email agent@test.example
        git config user.name "Agent E2E"
        git add -A
        git commit -qm baseline
        anatomist index . --no-classpath --output .anatomist/index.db >/dev/null
      cwd: .
      timeout_sec: 60
checks:
  - id: freshness-before-source
    type: extension
    provider: anatomist
    severity: hard
    description: Agent 必须经过 freshness 门禁再读取精确方法源码。
    config: {check: command_sequence, commands: [skill, doctor, index, context]}
    covers: [anatomist-routing]
  - id: runtime-boundary-answer
    type: extension
    provider: anatomist
    severity: hard
    description: 回答必须给出 approved 条件，并明确静态证据不能证明昨晚请求实际执行。
    config:
      check: response_regex
      all:
        - 'approved'
        - 'notifyCustomer\(\)'
        - '静态|source|源码'
        - '无法.*证明|不能.*证明|不足以.*证明|无法.*确定|不能.*确定'
        - '日志|log|trace|链路|指标|metric|运行时'
    covers: [grounded-answer]
  - id: source-clean
    type: extension
    provider: anatomist
    severity: hard
    description: 分析不得改动源码。
    config: {check: git_clean}
    covers: [source-integrity]
  - id: fresh-index
    type: extension
    provider: anatomist
    severity: hard
    description: 最终索引必须匹配当前源码。
    config: {check: index_fresh}
    covers: [fresh-index]
references:
  key_points:
    - dispatch(false) 直接返回 false；只有 approved 为 true 才调用 notifyCustomer()。
    - 静态源码只能证明可能路径，不能证明 order-42 昨晚实际走过该路径。
    - 运行时结论至少需要请求日志、trace 或指标。
  sources:
    - fixtures/runtime-boundary-project/src/main/java/sample/DispatchService.java
metadata: {owner: anatomist, source: agent-e2e-pilot, created_at: '2026-09-04'}
extensions:
  anatomist: {project_root: runtime-app}
tags: [anatomist, e2e, factual, runtime-boundary]
priority: P0
