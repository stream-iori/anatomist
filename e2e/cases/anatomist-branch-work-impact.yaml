schema_version: jury.case/v2
extends: ../templates/anatomist-versions-codex-sdk.yaml
merge: {checks: append}
id: anatomist-branch-work-impact
name: 分析分支开发影响
category: e2e
scenario:
  given: 用户希望分析分叉后的工作，包含测试调用方。
  when: Agent 阅读任务并通过 Anatomist 取证。
  then: diff 自动捕获 TEST，并使用正确共同祖先。
setup:
  env:
    ANATOMIST_E2E_SCENARIO: work
prompt:
  language: zh-CN
  text: |
    请完成 ../version-request.md 中的版本分析任务。
    使用本次提供的 Anatomist skill，保留项目源码和 checkout 状态。
    回答区分确定的静态调用关系、可能派发和证据覆盖范围。
checks:
  - id: version-answer
    type: extension
    provider: anatomist
    severity: hard
    config:
      check: response_regex
      all:
        - 'Direct'
        - 'Check'
        - 'Worker'
    covers: [grounded-answer, coverage-boundary]
metadata: {owner: anatomist, source: versions-agent-e2e}
tags: [anatomist, e2e, versions, callers]
priority: P0
