schema_version: jury.case/v2
extends: ../templates/anatomist-versions-codex-sdk.yaml
merge: {checks: append}
id: anatomist-storage-lifecycle
name: 回收旧快照并保留导航证据
category: e2e
scenario:
  given: 用户提出版本比较与存储边界问题。
  when: Agent 通过当前 Anatomist 能力取证。
  then: Agent 先预览再执行 GC，保护本次快照并验证结果。
setup:
  env:
    ANATOMIST_E2E_SCENARIO: storage
prompt:
  language: zh-CN
  text: |
    完成 ../version-request.md 中的任务，使用本次提供的 Anatomist skill。
    保留源码和 checkout 状态，结论以结构化输出为依据。
checks:
  - id: lifecycle-evidence
    type: extension
    provider: anatomist
    severity: hard
    config: {check: snapshot_storage}
    covers: [source-integrity, coverage-boundary]
metadata: {owner: anatomist, source: versions-agent-e2e}
tags: [anatomist, e2e, versions, lifecycle]
priority: P1
