name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-jar:
    name: Build JVM jar and static assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up GraalVM
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven

      - name: Build shaded jar
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mvn -q -DskipTests -Drevision="${version}" -Dchangelist= package

      - name: Stage assets
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp target/anatomist.jar release-assets/anatomist.jar
          cp SKILL.md release-assets/SKILL.md
          test "$(java -jar release-assets/anatomist.jar --version)" = "anatomist ${version}"

      - name: Upload jar/static assets
        uses: actions/upload-artifact@v7
        with:
          name: jar-and-static
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64 native binary
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Assert arm64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Set up GraalVM
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven

      - name: Build native binary
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mvn -Pnative -DskipTests -Drevision="${version}" -Dchangelist= package

      - name: Prepare diff E2E dependencies
        run: |
          python3 -m venv target/e2e-venv
          target/e2e-venv/bin/pip install -r e2e/requirements.txt

      - name: Diff and help release gate (JAR and native)
        run: |
          target/e2e-venv/bin/python scripts/agent-help-e2e.py --jar target/anatomist.jar --native target/anatomist --validate-schema --report target/agent-help-e2e.json
          target/e2e-venv/bin/python scripts/diff-e2e.py --jar target/anatomist.jar --native target/anatomist --report target/diff-native-e2e.json

      - name: Upload diff diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diff-diagnostics-${{ runner.os }}
          path: target/*e2e*.json
          if-no-files-found: ignore

      - name: Config E2E (native)
        run: bash scripts/config-e2e.sh native target/anatomist

      - name: Stage macOS binary
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp target/anatomist release-assets/anatomist-darwin-aarch64
          xattr -cr release-assets/anatomist-darwin-aarch64 2>/dev/null || true
          codesign --force --sign - release-assets/anatomist-darwin-aarch64 2>/dev/null || true
          file release-assets/anatomist-darwin-aarch64
          test "$(release-assets/anatomist-darwin-aarch64 --version)" = "anatomist ${version}"

      - name: Upload macOS asset
        uses: actions/upload-artifact@v7
        with:
          name: macos-native
          path: release-assets/anatomist-darwin-aarch64
          if-no-files-found: error

  build-linux-amd64:
    name: Build Linux amd64 native binary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Java for JAR/native comparison
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: "25"

      - name: Build native binary in CentOS 7 container
        env:
          ANATOMIST_LINUX_BASE_IMAGE: docker.io/library/centos:centos7.9.2009
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          ANATOMIST_MAVEN_ARGS="-Drevision=${version} -Dchangelist=" ./docker/build-linux-amd64.sh

      - name: Prepare diff E2E dependencies
        run: |
          python3 -m venv target/e2e-venv
          target/e2e-venv/bin/pip install -r e2e/requirements.txt

      - name: Diff and help release gate (JAR and native)
        run: |
          target/e2e-venv/bin/python scripts/agent-help-e2e.py --jar target/anatomist.jar --native target/anatomist --validate-schema --report target/agent-help-e2e.json
          target/e2e-venv/bin/python scripts/diff-e2e.py --jar target/anatomist.jar --native target/anatomist --report target/diff-native-e2e.json

      - name: Upload diff diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diff-diagnostics-${{ runner.os }}
          path: target/*e2e*.json
          if-no-files-found: ignore

      - name: Config E2E (native)
        run: bash scripts/config-e2e.sh native target/anatomist

      - name: Stage Linux binary
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp target/anatomist release-assets/anatomist-linux-amd64
          file release-assets/anatomist-linux-amd64
          test "$(release-assets/anatomist-linux-amd64 --version)" = "anatomist ${version}"

      - name: Upload Linux asset
        uses: actions/upload-artifact@v7
        with:
          name: linux-native
          path: release-assets/anatomist-linux-amd64
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-jar
      - build-macos
      - build-linux-amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded-artifacts

      - name: Prepare upload directory
        run: |
          set -euo pipefail
          mkdir -p upload
          find downloaded-artifacts/jar-and-static downloaded-artifacts/macos-native downloaded-artifacts/linux-native -maxdepth 3 -type f -exec cp {} upload/ \;
          ls -lh upload

      - name: Generate release notes
        run: |
          set -euo pipefail
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^{commit}^" 2>/dev/null || true)"
          {
            echo "## Changes"
            if [ -n "$previous_tag" ]; then
              git log --oneline --no-merges "${previous_tag}..${RELEASE_TAG}" | sed 's/^/- /'
            else
              git log --oneline --no-merges -30 "${RELEASE_TAG}" | sed 's/^/- /'
            fi
            echo
            echo "## Assets"
            echo "- anatomist-darwin-aarch64"
            echo "- anatomist-linux-amd64"
            echo "- anatomist.jar"
            echo "- SKILL.md"
          } > release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "anatomist ${RELEASE_TAG}" \
              --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" upload/* --clobber
          else
            gh release create "${RELEASE_TAG}" upload/* \
              --title "anatomist ${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
